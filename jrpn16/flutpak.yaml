output: flatpak
flutter: # autoresolve to latest stable release

repo-url:  https://github.com/zathras-de/jrpn_test
subdir: jrpn16

app-id: com.jovial.jrpn16
runtime-version: '25.08'
command: jrpn16


metainfo-path: app/share/metainfo/com.jovial.jrpn16.metainfo.xml
desktop-entry-path: app/share/applications/com.jovial.jrpn16.desktop


icons:
  - size: 256x256
    path: app/share/icons/hicolor/256x256/apps/com.jovial.jrpn16.png
  - size: 512x512
    path: app/share/icons/hicolor/512x512/apps/com.jovial.jrpn16.png

finish-args:
  - --share=network
