#
#
Name:  Build calculators
description: "Builds jrpn15 and jrpn16 flatpaks for the current architecture"

inputs:
    arch:
        description: "Architecture, x86_64 or aarch64"
 
runs:
  steps:
    name: Install tools
    - shell: bash
    - uses: subosito/flutter-action@v2
      with:
          channel: 'stable'
          # flutter:version: '3.0.0'
    - uses: o-murphy/flutpak/.github/actions/setup-flutpak@v0.8.6
    - run: |
        apt-get install appstream
        apt-get install flatpak
        flatpak remote-add --user --if-not-exists flathub \
           https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install flathub org.freedesktop.Sdk//26.08

#     - run: flutter pub upgrade
        
